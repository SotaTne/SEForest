[tools]
bun = "1.3.14"
python = { version = "3.14.6", virtualenv = "Forest_Program/.venv" }
uv = "0.11.13"

# セットアップ
[tasks.setup]
description = "プロジェクトのセットアップを行います"
depends = ["setup:python", "setup:docs"]

# 全てのチェック
[tasks.check]
description = "コードのチェックを行います"
depends = ["lint", "typecheck", "format", "check:html", "check:mmd"]

# pythonのタスク
[tasks."setup:python"]
description = "uvのセットアップを行います"
dir = "Forest_Program"
run = "mise run setup"

[tasks.dev]
description = "アプリを開発モードで実行します"
dir = "Forest_Program"
run = "mise run dev"

[tasks.lint]
description = "コードのリントを行います"
dir = "Forest_Program"
run = "mise run lint"

[tasks.typecheck]
description = "型チェックを行います"
dir = "Forest_Program"
run = "mise run typecheck"

[tasks.format]
description = "コードのフォーマットを行います"
dir = "Forest_Program"
run = "mise run format"

[tasks.test]
description = "テストを実行します"
dir = "Forest_Program"
run = "mise run test"

[tasks.build]
description = "ビルドを行います"
dir = "Forest_Program"
run = "mise run build"

[tasks.preview]
description = "ビルドしたアプリをプレビューします"
dir = "Forest_Program"
run = "mise run preview"

# htmlのチェック
[tasks."check:html"]
description = "HTMLのコードのチェックを行います"
usage = '''
arg "[files]" var=#true help="チェック対象のHTMLファイルまたはglob"
'''
run = '''
{% if usage.files | length > 0 %}
bun run check:html --{% for file in usage.files %} {{ file | quote }}{% endfor %}
{% else %}
bun run check:html -- "**/*.html"
{% endif %}
'''

# Mermaid図のチェック
[tasks."check:mmd"]
description = "Mermaid図をSVGへレンダリングして検証します"
run = "bun run check:mmd"

# HTMLのフォーマット
[tasks."format:html"]
description = "HTMLをPrettierで整形します"
usage = '''
arg "[files]" var=#true help="整形するHTMLファイルまたはglob"
'''
run = '''
{% if usage.files | length > 0 %}
bun run format:html --{% for file in usage.files %} {{ file | quote }}{% endfor %}
{% else %}
bun run format:html -- "Forest_Document/**/*.html"
{% endif %}
'''

[tasks."check:format:html"]
description = "HTMLがPrettierで整形済みか確認します"
usage = '''
arg "[files]" var=#true help="確認するHTMLファイルまたはglob"
'''
run = '''
{% if usage.files | length > 0 %}
bun run check:format:html --{% for file in usage.files %} {{ file | quote }}{% endfor %}
{% else %}
bun run check:format:html -- "Forest_Document/**/*.html"
{% endif %}
'''

[tasks."typecheck:docs"]
description = "ドキュメントの型チェックを行います"
run = "bun run typecheck"

# ドキュメントサーバー
[tasks."setup:docs"]
description = "ドキュメントサーバーのセットアップを行います"
run = "bun install"

[tasks."docs:dev"]
description = "ドキュメントサーバーを起動します"
run = "bun run dev"

[tasks."docs:build"]
description = "ドキュメントをビルドします"
run = "bun run build"

[tasks."docs:preview"]
description = "ビルドしたドキュメントをプレビューします"
run = "bun run preview"
